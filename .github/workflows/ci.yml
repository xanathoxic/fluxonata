name: ci
on: [push, pull_request]
# Le job ne publie rien et n'appelle pas l'API GitHub : seul le checkout lit le dépôt.
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - run: cp .env.example .env && sed -i "s|^ORCH_SECRET_KEY=.*|ORCH_SECRET_KEY=$(python3 -c 'import secrets;print(secrets.token_urlsafe(50))')|" .env
      - run: python3 -m venv .venv && .venv/bin/pip install -r backend/requirements.txt -c backend/constraints.txt -r backend/requirements-dev.txt
      - run: cd frontend && npm ci
      - run: docker pull python:3.13-slim
      - run: docker compose -f infra/docker-compose.yml -p fluxonata up -d --wait db testsvc
      - run: scripts/ci.sh --skip-e2e
      # Chromium et ses bibliothèques système (sudo apt du runner), pour la version Playwright épinglée du projet
      - run: cd frontend && npx playwright install --with-deps chromium
      # E2E sur la base jetable du job : migrations, puis données de démonstration, services prêts, tests (scripts/ci-e2e.sh)
      - run: scripts/ci-e2e.sh
        env:
          CI_DISPOSABLE_DB: "1"
  # Seuil de couverture : mesure isolée (venv et PostgreSQL jetables) comparée à backend/tests/fixtures/coverage_baseline.json ; échoue si le
  # total baisse de plus de 0,30 point ou un paquet de plus de 1 point (marges dans scripts/coverage_report.py).
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.13" }
      - run: scripts/coverage.sh --gate
