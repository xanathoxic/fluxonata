name: ci
on: [push, pull_request]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cp .env.example .env && sed -i "s|^ORCH_SECRET_KEY=.*|ORCH_SECRET_KEY=$(python3 -c 'import secrets;print(secrets.token_urlsafe(50))')|" .env
      - run: python3 -m venv .venv && .venv/bin/pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: cd frontend && npm ci
      - run: docker pull python:3.13-slim
      - run: docker compose -f infra/docker-compose.yml -p fluxonata up -d --wait db
      - run: scripts/ci.sh
