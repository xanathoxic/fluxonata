name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Texte de la release = section du journal des modifications
        run: |
          awk -v tag="## ${GITHUB_REF_NAME} " 'index($0, tag)==1 {p=1; next} /^## / && p {exit} p' CHANGELOG.md > notes.md
          test -s notes.md || echo "Voir CHANGELOG.md" > notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Fluxonata $GITHUB_REF_NAME" --notes-file notes.md
