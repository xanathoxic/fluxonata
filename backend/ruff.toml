line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*"]
[lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]  # lignes longues : le formateur coupe le code à 120, restent chaînes et commentaires français (justifié le 2026-11-12)
[lint.per-file-ignores]
# Tests : seules les règles S qui se déclenchent réellement sont exemptées (relevé du 2026-11-12) ; B n'est plus exempté.
# S101 assertions ; S603/S607 sous-processus des aides de test ; S105/S106/S107 valeurs factices ; S104/S108/S310 serveurs et fichiers temporaires locaux.
"tests/*" = ["S101", "S104", "S105", "S106", "S107", "S108", "S310", "S603", "S607"]
