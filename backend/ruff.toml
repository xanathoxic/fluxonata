"tests/test_ai_edit_job.py" = ["S", "B", "F811", "F401"]
"tests/test_ai_service_ops.py" = ["S", "B", "F811", "F401"]
"tests/test_ai_plan.py" = ["S", "B", "F811", "F401"]
"tests/test_ai_dryrun.py" = ["S", "B", "F811", "F401", "E501"]
"tests/test_ai_jobs.py" = ["S", "B", "F811", "F401", "E501"]
"tests/test_ai_outline.py" = ["S", "B", "F811", "F401", "E501"]
"tests/test_action_contract.py" = ["S", "B", "E501"]
"tests/test_validation_subworkflow.py" = ["S", "B", "F811", "F401", "E501"]  # reuses the ai_ws fixture of test_ai.py
