# Typage Python du code applicatif du backend : zéro erreur, toute régression est bloquante (voir scripts/mypy_baseline.py).
# Périmètre : code applicatif du backend (hors migrations et tests). Aucune exclusion générale ni `Any` ajouté pour passer.
[mypy]
python_version = 3.13
plugins = mypy_django_plugin.main, mypy_drf_plugin.main
files = ai, audit, bundles, catalog, core, formbuilder, fluxonata, runs, tenancy, triggers, vault, workflows
exclude = (^|/)migrations/
warn_unused_ignores = True
warn_redundant_casts = True
show_error_codes = True
pretty = False

[mypy.plugins.django-stubs]
django_settings_module = fluxonata.settings
