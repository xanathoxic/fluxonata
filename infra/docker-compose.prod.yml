# Production-like stack (single host). Secrets come from infra/.env.prod, generated by scripts/prod-init.sh (never committed).
# The worker needs the Docker daemon to start isolated action containers: it is a TRUSTED component (see « Durcissement et limites » in docs/INSTALL.md).
name: fluxonata-prod
x-backend: &backend
  image: fluxonata-backend:local
  pull_policy: never   # built once by the `migrate` service below
  env_file: .env.prod
  restart: unless-stopped
  depends_on:
    migrate: { condition: service_completed_successfully }
  volumes:
    - keys:/keys
    - artifacts:/app/var/artifacts
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fluxonata
      POSTGRES_USER: fluxonata
      POSTGRES_PASSWORD: ${ORCH_DB_PASSWORD:?run scripts/prod-init.sh}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxonata -d fluxonata"]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    <<: *backend
    build: { context: .., dockerfile: infra/Dockerfile.backend }
    pull_policy: build
    restart: "no"
    depends_on:
      db: { condition: service_healthy }
    command: ["sh", "-c", "python manage.py migrate --noinput"]
  api:
    <<: *backend
  orchestrator:
    <<: *backend
    command: ["python", "manage.py", "run_orchestrator"]
  worker:
    <<: *backend
    user: "0:0"   # needs access to the Docker socket; the action containers themselves run as 65534 without capabilities
    command: ["python", "manage.py", "run_worker"]
    volumes:
      - keys:/keys
      - artifacts:/app/var/artifacts
      - /var/run/docker.sock:/var/run/docker.sock
      - ${ORCH_WORK_DIR:?}:${ORCH_WORK_DIR}   # same path on host and in the container: the daemon mounts it into action containers
  testsvc:
    image: python:3.13-slim
    restart: unless-stopped
    command: ["python", "/srv/server.py"]
    volumes: ["./testsvc/server.py:/srv/server.py:ro"]
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    networks:
      egress_test: { aliases: [testsvc] }
  web:
    build: { context: .., dockerfile: infra/Dockerfile.web }
    restart: unless-stopped
    depends_on: [api]
    ports: ["127.0.0.1:${ORCH_HTTP_PORT:-8080}:80"]
volumes: { pgdata: {}, keys: {}, artifacts: {} }
networks:
  egress_test:
    name: ${ORCH_EGRESS_TEST_NETWORK:-fluxonata-prod-egress}
    internal: true
