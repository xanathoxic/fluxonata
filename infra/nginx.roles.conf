# Variante PAR RÔLES de nginx.conf (infra/docker-compose.roles.yml). Même contenu statique et mêmes en-têtes ; seules les routes /api/ changent.
# Static frontend + reverse proxy to the API. Terminate TLS in front of this (or add a `listen 443 ssl` block):
# without TLS, set ORCH_INSECURE_COOKIES=1 for local evaluation only.
# Journal d'accès : les jetons « capacité » portés par l'adresse (formulaires publics, reprises) sont remplacés par [jeton] ; la route, la méthode,
# le statut et le reste de la ligne restent lisibles. L'adresse transmise à l'API n'est PAS modifiée. Expressions produites par nginx_patterns() de backend/core/urlredact.py (la route est reconnue aussi écrite avec des lettres encodées en pourcent ou des barres doublées)
# (vérifiée par backend/tests/test_url_token_logs.py). Journal d'ERREURS : nginx y écrit la ligne de requête brute et n'offre aucun format ; les routes à jeton ont donc `error_log … crit`
# (décision du 2026-11-09, docs/ADMIN.md) : leurs erreurs de niveau inférieur ne sont pas écrites, le diagnostic passe par les champs amont du journal d'accès.
map $request_uri $fluxonata_log_uri {
    default $request_uri;
    ~*^(?<fx_api>(?:/|%2[fF])+(?:(?:%41|%61|a)(?:%50|%70|p)(?:%49|%69|i)(?:/|%2[fF])+(?:%56|%76|v)(?:%31|1)(?:/|%2[fF])+(?:%46|%66|f)(?:%4F|%6F|o)(?:%52|%72|r)(?:%4D|%6D|m)(?:%53|%73|s)|(?:%41|%61|a)(?:%50|%70|p)(?:%49|%69|i)(?:/|%2[fF])+(?:%56|%76|v)(?:%31|1)(?:/|%2[fF])+(?:%52|%72|r)(?:%45|%65|e)(?:%53|%73|s)(?:%55|%75|u)(?:%4D|%6D|m)(?:%45|%65|e)(?:%2D|\-)(?:%46|%66|f)(?:%4F|%6F|o)(?:%52|%72|r)(?:%4D|%6D|m)(?:%53|%73|s)|(?:%41|%61|a)(?:%50|%70|p)(?:%49|%69|i)(?:/|%2[fF])+(?:%56|%76|v)(?:%31|1)(?:/|%2[fF])+(?:%48|%68|h)(?:%4F|%6F|o)(?:%4F|%6F|o)(?:%4B|%6B|k)(?:%53|%73|s)(?:/|%2[fF])+(?:%52|%72|r)(?:%45|%65|e)(?:%53|%73|s)(?:%55|%75|u)(?:%4D|%6D|m)(?:%45|%65|e))(?:/|%2[fF])+)[^/?]+(?<fx_api_rest>.*)$ "${fx_api}[jeton]${fx_api_rest}";
    ~*^(?<fx_page>(?:/|%2[fF])+(?:(?:%46|%66|f)|(?:%52|%72|r))(?:/|%2[fF])+)[^/?]+(?<fx_page_rest>.*)$ "${fx_page}[jeton]${fx_page_rest}";
}
map $http_referer $fluxonata_log_referer {
    default $http_referer;
    ~*^(?<fx_rapi>https?://[^/]+(?:/|%2[fF])+(?:(?:%41|%61|a)(?:%50|%70|p)(?:%49|%69|i)(?:/|%2[fF])+(?:%56|%76|v)(?:%31|1)(?:/|%2[fF])+(?:%46|%66|f)(?:%4F|%6F|o)(?:%52|%72|r)(?:%4D|%6D|m)(?:%53|%73|s)|(?:%41|%61|a)(?:%50|%70|p)(?:%49|%69|i)(?:/|%2[fF])+(?:%56|%76|v)(?:%31|1)(?:/|%2[fF])+(?:%52|%72|r)(?:%45|%65|e)(?:%53|%73|s)(?:%55|%75|u)(?:%4D|%6D|m)(?:%45|%65|e)(?:%2D|\-)(?:%46|%66|f)(?:%4F|%6F|o)(?:%52|%72|r)(?:%4D|%6D|m)(?:%53|%73|s)|(?:%41|%61|a)(?:%50|%70|p)(?:%49|%69|i)(?:/|%2[fF])+(?:%56|%76|v)(?:%31|1)(?:/|%2[fF])+(?:%48|%68|h)(?:%4F|%6F|o)(?:%4F|%6F|o)(?:%4B|%6B|k)(?:%53|%73|s)(?:/|%2[fF])+(?:%52|%72|r)(?:%45|%65|e)(?:%53|%73|s)(?:%55|%75|u)(?:%4D|%6D|m)(?:%45|%65|e))(?:/|%2[fF])+)[^/?#]+(?<fx_rapi_rest>.*)$ "${fx_rapi}[jeton]${fx_rapi_rest}";
    ~*^(?<fx_rpage>https?://[^/]+(?:/|%2[fF])+(?:(?:%46|%66|f)|(?:%52|%72|r))(?:/|%2[fF])+)[^/?#]+(?<fx_rpage_rest>.*)$ "${fx_rpage}[jeton]${fx_rpage_rest}";
}
log_format fluxonata '$remote_addr - $remote_user [$time_local] "$request_method $fluxonata_log_uri $server_protocol" '
                     '$status $body_bytes_sent "$fluxonata_log_referer" "$http_user_agent" '
                     'rt=$request_time ua=$upstream_addr us=$upstream_status urt=$upstream_response_time';
server {
    listen 80;
    access_log /var/log/nginx/access.log fluxonata;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    # Compression des réponses textuelles (interface : 2,1 Mo de JavaScript -> ~0,6 Mo). Désactivée sur chaque route proxy vers l'API (BREACH : secrets reflétés dans des réponses compressées).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css text/plain text/javascript application/javascript image/svg+xml;

    # Déploiement par rôles (ADR 0022) : chaque surface va vers SON service. Les noms sont résolus à la demande (variables + résolveur de Docker) :
    # nginx démarre même si un rôle est arrêté, et l'arrêt d'`api-ingest` ne rend que les webhooks/formulaires publics indisponibles (502), pas l'interface.
    resolver 127.0.0.11 valid=5s ipv6=off;
    location /api/v1/hooks/resume/ {
        set $UP http://api-ingest:8000;
        error_log /var/log/nginx/error.log crit;   # la ligne de requête brute des erreurs porterait le jeton
        proxy_pass $UP;
        gzip off;   # BREACH : pas de compression des réponses de l'API
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location /api/v1/hooks/ {
        set $UP http://api-ingest:8000;
        proxy_pass $UP;
        gzip off;   # BREACH : pas de compression des réponses de l'API
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location /api/v1/forms/ {
        set $UP http://api-ingest:8000;
        error_log /var/log/nginx/error.log crit;   # la ligne de requête brute des erreurs porterait le jeton
        proxy_pass $UP;
        gzip off;   # BREACH : pas de compression des réponses de l'API
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location /api/v1/resume-forms/ {
        set $UP http://api-ingest:8000;
        error_log /var/log/nginx/error.log crit;   # la ligne de requête brute des erreurs porterait le jeton
        proxy_pass $UP;
        gzip off;   # BREACH : pas de compression des réponses de l'API
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location /api/v1/runner/ {
        set $UP http://runner-gw:8000;
        proxy_pass $UP;
        gzip off;   # BREACH : pas de compression des réponses de l'API
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;   # attentes longues des runners
    }
    location /api/ {
        set $UP http://api-ui:8000;
        proxy_pass $UP;
        gzip off;   # BREACH : pas de compression des réponses de l'API
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
    # Pages publiques à jeton de l'interface (/f/<jeton>, /r/<jeton>) : même service statique, journal d'erreurs limité à crit.
    location ~ ^/(?:f|r)/ {
        error_log /var/log/nginx/error.log crit;
        try_files $uri /index.html;
    }
    # Fichiers à empreinte de contenu (Vite) : immuables, mis en cache un an. index.html reste revalidé à chaque chargement.
    # Un `add_header` dans un bloc location remplace ceux du serveur : les en-têtes de sécurité sont donc répétés ici.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.html;
    }
}
