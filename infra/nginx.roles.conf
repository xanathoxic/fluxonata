# Variante PAR RÔLES de nginx.conf (infra/docker-compose.roles.yml). Même contenu statique et mêmes en-têtes ; seules les routes /api/ changent.
# Static frontend + reverse proxy to the API. Terminate TLS in front of this (or add a `listen 443 ssl` block):
# without TLS, set ORCH_INSECURE_COOKIES=1 for local evaluation only.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    # Déploiement par rôles (ADR 0022) : chaque surface va vers SON service. Les noms sont résolus à la demande (variables + résolveur de Docker) :
    # nginx démarre même si un rôle est arrêté, et l'arrêt d'`api-ingest` ne rend que les webhooks/formulaires publics indisponibles (502), pas l'interface.
    resolver 127.0.0.11 valid=5s ipv6=off;
    location /api/v1/hooks/ {
        set $UP http://api-ingest:8000;
        proxy_pass $UP;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location /api/v1/forms/ {
        set $UP http://api-ingest:8000;
        proxy_pass $UP;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location /api/v1/resume-forms/ {
        set $UP http://api-ingest:8000;
        proxy_pass $UP;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location /api/v1/runner/ {
        set $UP http://runner-gw:8000;
        proxy_pass $UP;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;   # attentes longues des runners
    }
    location /api/ {
        set $UP http://api-ui:8000;
        proxy_pass $UP;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
    location / {
        try_files $uri /index.html;
    }
}
