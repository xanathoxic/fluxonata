# Front HTTPS des AGENTS DISTANTS (docker-compose.remote-agents.yml). Il ne sert QUE le protocole des runners : tout le reste répond 404.
# Un agent sur une autre machine n'atteint donc ni l'interface, ni l'API des espaces, ni l'administration, ni les webhooks : seulement /api/v1/runner/.
# Le jeton de l'agent (en-tête Authorization) n'est jamais écrit dans un journal ; l'adresse n'est journalisée que SANS paramètres de requête, et aucun corps
# de requête ou de réponse n'est journalisé (les réponses de /jobs/request/ portent les secrets de la tâche). TLS est obligatoire : aucun port en clair.

log_format runner '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent ${request_time}s';
limit_req_zone $binary_remote_addr zone=runner_rate:10m rate=60r/s;
limit_conn_zone $binary_remote_addr zone=runner_conn:10m;

server {
    listen 8443 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /dev/stdout runner;
    error_log /dev/stderr crit;   # la ligne de requête brute d'une erreur ne doit pas être conservée

    # Taille bornée : résultat (≤ 1 Mo avant échappement JSON), journaux (≤ 64 Ko) et enveloppe ; au-delà, la plate-forme refuserait de toute façon.
    client_max_body_size 4m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    limit_conn runner_conn 200;   # une attente longue occupe une connexion

    resolver 127.0.0.11 valid=10s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/v1/runner/ {
        if ($request_method !~ ^(GET|POST)$) { return 405; }
        limit_req zone=runner_rate burst=200 nodelay;
        set $UP http://runner-gw:8000;
        proxy_pass $UP;
        proxy_set_header Host runner-gw;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;   # attentes longues des runners
    }

    location / {
        return 404;
    }
}
