# Pooler de connexions (AR1.2). PostgreSQL lui-même est EXTERNE (service managé ou opérateur) : sa haute disponibilité n'est pas décrite ici (AR5.1).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  labels: {app.kubernetes.io/name: pgbouncer, app.kubernetes.io/part-of: fluxonata}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: pgbouncer}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: pgbouncer, app.kubernetes.io/part-of: fluxonata, fluxonata/egress: "database"}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: pgbouncer
        image: edoburu/pgbouncer@sha256:8638aa563607256d3c7440437534195f1066a92b68015d89ae9d6b935b444a6d
        env:
        - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: fluxonata-db-url, key: url}}}   # postgres://fluxonata:MOTDEPASSE@hôte-postgresql:5432/fluxonata
        - {name: AUTH_TYPE, value: scram-sha-256}
        - {name: POOL_MODE, value: transaction}
        - {name: MAX_CLIENT_CONN, value: "400"}
        - {name: DEFAULT_POOL_SIZE, value: "20"}
        - {name: QUERY_WAIT_TIMEOUT, value: "30"}
        ports: [{containerPort: 5432, name: pg}]
        readinessProbe: {tcpSocket: {port: pg}, periodSeconds: 5}
        resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}, seccompProfile: {type: RuntimeDefault}}
---
apiVersion: v1
kind: Service
metadata: {name: pgbouncer}
spec:
  selector: {app.kubernetes.io/name: pgbouncer}
  ports: [{port: 5432, targetPort: pg, name: pg}]
