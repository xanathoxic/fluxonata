# Mise à l'échelle sur le CPU (point de départ ; les seuils ne sont PAS issus d'une mesure). Pas d'autoscaling d'`orchestrator` (état en base, plusieurs instances possibles :
# AR4.1) ni de worker `exec` (AR6.4 : profondeur de file, KEDA — non fait).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: api-ui}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api-ui}
  minReplicas: 2
  maxReplicas: 6
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: api-ingest}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api-ingest}
  minReplicas: 2
  maxReplicas: 8
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
