# orchestrator : base de données seule + sorties selon `fluxonata/egress`. Pas de socket Docker (voir README : plan d'exécution = agents).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  labels: {app.kubernetes.io/name: orchestrator, app.kubernetes.io/part-of: fluxonata}
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 1, maxSurge: 0}}
  selector: {matchLabels: {app.kubernetes.io/name: orchestrator}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: orchestrator, app.kubernetes.io/part-of: fluxonata, fluxonata/egress: "denied"}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      containers:
      - name: orchestrator
        image: fluxonata-backend:local
        command: ["python", "manage.py", "run_orchestrator"]
        envFrom: [{configMapRef: {name: fluxonata-config}}, {secretRef: {name: fluxonata-secrets}}]
        env:
        livenessProbe:
          exec: {command: ["python", "manage.py", "healthcheck", "--kind", "orchestrator"]}
          initialDelaySeconds: 40
          periodSeconds: 15
          timeoutSeconds: 20
          failureThreshold: 3
        resources: {requests: {cpu: 100m, memory: 192Mi}, limits: {memory: 512Mi}}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
          runAsNonRoot: true
          runAsUser: 10001
          seccompProfile: { type: RuntimeDefault }
        volumeMounts:
        - {name: tmp, mountPath: /tmp}

      volumes:
      - {name: tmp, emptyDir: {medium: Memory}}

