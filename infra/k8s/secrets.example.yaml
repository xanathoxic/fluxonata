# MODÈLE — ne contient AUCUNE valeur réelle et n'est PAS dans kustomization.yaml. Créez les Secrets avec `kubectl create secret …` (ou votre gestionnaire de secrets) :
#   kubectl -n fluxonata create secret generic fluxonata-secrets \
#     --from-literal=ORCH_SECRET_KEY="$(python3 -c 'import secrets;print(secrets.token_urlsafe(50))')" \
#     --from-literal=ORCH_DB_PASSWORD='…' --from-literal=ORCH_TRUSTED_ORIGINS='https://fluxonata.exemple.org' \
#     --from-literal=ORCH_S3_ENDPOINT='https://s3.exemple.org' --from-literal=ORCH_S3_BUCKET='fluxonata' \
#     --from-literal=ORCH_S3_ACCESS_KEY='…' --from-literal=ORCH_S3_SECRET_KEY='…'
# Clé du coffre : créez-la UNE fois hors du cluster (`docker run --rm -v $PWD/keys:/keys -e ORCH_KEY_AUTOCREATE=1 <image> python manage.py vault_init`), puis :
#   kubectl -n fluxonata create secret generic fluxonata-keys --from-file=./keys   # sauvegardez ./keys À PART des données
apiVersion: v1
kind: Secret
metadata: {name: fluxonata-secrets}
type: Opaque
stringData: {}
